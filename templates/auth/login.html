{% extends 'base.html' %}

{% block title %}Sign In — Smart Expense Tracker{% endblock %}

{% block content %}
<div style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 24px;">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 6px;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to your AI-Powered financial command center</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control-custom" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" style="margin-bottom: 0;"><i class="fa-solid fa-lock"></i> Password</label>
                </div>
                <input type="password" name="password" class="form-control-custom" placeholder="••••••••" required>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" name="remember" value="1"> Remember me
                </label>
            </div>

            <button type="submit" class="btn-custom btn-primary-glow" style="width: 100%; padding: 12px; font-size: 0.95rem;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-sub);">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" style="font-weight: 600; color: var(--primary-light);">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
