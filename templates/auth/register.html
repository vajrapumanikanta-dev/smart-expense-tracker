{% extends 'base.html' %}

{% block title %}Create Account — Smart Expense Tracker{% endblock %}

{% block content %}
<div style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="width: 100%; max-width: 480px; padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 24px;">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 6px;">Create Account</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Start tracking with intelligent automation and analytics</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label"><i class="fa-regular fa-user"></i> Full Name</label>
                <input type="text" name="name" class="form-control-custom" placeholder="Alex Morgan" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control-custom" placeholder="alex@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control-custom" placeholder="•••••••• (Min. 6 chars)" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-check-double"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control-custom" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-custom btn-primary-glow" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 10px;">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-sub);">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--primary-light);">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
